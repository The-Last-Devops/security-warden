id: ai-agent-auto-approve
severity: high
platforms: [macos, windows, linux]
source: ai_agents
match: "item.kind == \"auto_approve\""
title:
  en: "{tool} runs commands without asking ({setting})"
  vi: "{tool} chạy lệnh không hỏi ({setting})"
check:
  en: "AI agents ask before running commands"
  vi: "AI agent hỏi trước khi chạy lệnh"
explain:
  en: "With {setting} in {file}, instructions hidden in a web page, issue or README can make the agent run commands on this machine."
  vi: "Với {setting} trong {file}, chỉ dẫn giấu trong trang web, issue hay README có thể khiến agent chạy lệnh trên máy này."
fix:
  en: "Open {file} in a text editor and turn off {setting}. Claude Code: remove \"bypassPermissions\" and \"skipDangerousModePermissionPrompt\", replace a bare \"Bash\" allow with exact commands such as \"Bash(npm run test)\", set \"enableAllProjectMcpServers\": false. Codex: approval_policy = \"on-request\" and sandbox_mode = \"workspace-write\". VS Code: set \"chat.tools.autoApprove\": false. Use full auto mode only inside a container or VM."
  vi: "Mở {file} bằng trình soạn thảo và tắt {setting}. Claude Code: xoá \"bypassPermissions\" và \"skipDangerousModePermissionPrompt\", thay quyền \"Bash\" trống bằng từng lệnh cụ thể như \"Bash(npm run test)\", đặt \"enableAllProjectMcpServers\": false. Codex: approval_policy = \"on-request\" và sandbox_mode = \"workspace-write\". VS Code: đặt \"chat.tools.autoApprove\": false. Chỉ dùng chế độ tự chạy hoàn toàn trong container hoặc máy ảo."
author: the-last-devops
tests:
  - {"item": {"kind": "auto_approve", "tool": "Claude Code", "file": "/h/.claude/settings.json", "setting": "bypassPermissions"}, "expect": true}
  - {"item": {"kind": "mcp", "tool": "Claude Code", "file": "/h/.claude.json", "server": "github", "secret_keys": "", "has_secret": false, "plain_http": false, "unpinned_npx": false, "world_readable": false}, "expect": false}
