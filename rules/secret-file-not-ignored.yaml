id: secret-file-not-ignored
severity: medium
platforms: [macos, windows, linux]
source: dev_files
match: "item.kind != \"truncated\" && !item.tracked && !item.ignored"
title:
  en: "Secret file not in .gitignore: {repo_name}/{file}"
  vi: "File bí mật chưa nằm trong .gitignore: {repo_name}/{file}"
check:
  en: "Secret files are in .gitignore"
  vi: "File bí mật đã nằm trong .gitignore"
explain:
  en: "{file} in {repo} is one git add . away from being committed."
  vi: "{file} trong {repo} chỉ cách một lệnh git add . là bị commit."
fix:
  en: "Add {file} to {repo}/.gitignore."
  vi: "Thêm {file} vào {repo}/.gitignore."
author: the-last-devops
tests:
  - {"item": {"path": "/h/Code/app/.env", "repo": "/h/Code/app", "repo_name": "app", "file": ".env", "kind": "env", "tracked": false, "ignored": false}, "expect": true}
  - {"item": {"path": "/h/Code/app/.env", "repo": "/h/Code/app", "repo_name": "app", "file": ".env", "kind": "env", "tracked": false, "ignored": true}, "expect": false}
  - {"item": {"path": "/h/Code/app/.env", "repo": "/h/Code/app", "repo_name": "app", "file": ".env", "kind": "env", "tracked": true, "ignored": false}, "expect": false, "note": "covered by secret-file-committed"}
