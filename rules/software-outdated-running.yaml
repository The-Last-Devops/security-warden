id: software-outdated-running
severity: medium
platforms: [macos, linux]
source: outdated_software
match: item.kind == "running" && !item.reachable
title:
  en: "Out-of-date {name} {version} is running"
  vi: "{name} {version} đã cũ vẫn đang chạy"
check:
  en: "Running software is up to date"
  vi: "Phần mềm đang chạy đã cập nhật"
explain:
  en: "A newer version ({latest}) is available and may fix security bugs."
  vi: "Đã có bản mới ({latest}), có thể đã vá lỗi bảo mật."
fix:
  en: "Press Fix to update it, or run: brew upgrade {name}, then quit and reopen it."
  vi: "Bấm Sửa để cập nhật, hoặc chạy: brew upgrade {name}, rồi tắt và mở lại nó."
author: the-last-devops
tests:
  - {item: {kind: running, name: node, version: "22.1.0", latest: "22.11.0", reachable: false}, expect: true}
  - {item: {kind: running, name: node, version: "22.1.0", latest: "22.11.0", reachable: true}, expect: false, note: software-outdated-exposed covers it}
remedy: {action: brew_upgrade, params: {name: "{name}"}}
