id: history-has-secrets
severity: high
platforms: [macos, linux]
source: shell_history
match: "item.kind in [\"aws_key\", \"github_token\", \"ai_key\", \"slack_token\", \"private_key\"]"
title:
  en: "{count} secrets ({kind}) in {file}"
  vi: "{count} mật khẩu/token ({kind}) trong {file}"
check:
  en: "No tokens or keys in shell history"
  vi: "Không có token hay khoá trong lịch sử shell"
explain:
  en: "Commands with tokens pasted into them stay in your history file, which backups and sync tools copy."
  vi: "Lệnh có dán token vẫn nằm trong file lịch sử, mà file này bị backup và công cụ đồng bộ sao chép."
fix:
  en: "Rotate those tokens, delete the lines from {file}, and set setopt HIST_IGNORE_SPACE so commands starting with a space are not saved."
  vi: "Đổi các token đó, xoá các dòng trong {file}, và đặt setopt HIST_IGNORE_SPACE để lệnh bắt đầu bằng dấu cách không bị lưu."
author: the-last-devops
tests:
  - {"item": {"file": "/h/.zsh_history", "kind": "github_token", "count": 3}, "expect": true}
  - {"item": {"file": "/h/.zsh_history", "kind": "password_flag", "count": 3}, "expect": false}
