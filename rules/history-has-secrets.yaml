id: history-has-secrets
severity: high
platforms: [macos, linux]
source: shell_history
match: "item.family == \"token\""
title:
  en: "{count} secrets ({kind}) in {file}"
  vi: "{count} mật khẩu/token ({kind}) trong {file}"
check:
  en: "No tokens or keys in shell history"
  vi: "Không có token hay khoá trong lịch sử shell"
explain:
  en: "Commands with tokens pasted into them stay in your history file, which backups and sync tools copy."
  vi: "Lệnh có dán token vẫn nằm trong file lịch sử, mà file này bị backup và công cụ đồng bộ sao chép."
fix:
  en: "1. Revoke or rotate those tokens at the provider first. 2. Close all other terminal windows. Run nano {file}, delete those lines (Ctrl+K deletes a line), save with Ctrl+O then Enter, quit with Ctrl+X. Then run kill -9 $$ to close this terminal without writing its history back. 3. To keep a command out of history, start it with a space: zsh needs setopt HIST_IGNORE_SPACE in ~/.zshrc, bash needs HISTCONTROL=ignorespace in ~/.bashrc."
  vi: "1. Thu hồi hoặc đổi các token đó ở nhà cung cấp trước. 2. Đóng mọi cửa sổ terminal khác. Chạy nano {file}, xoá các dòng đó (Ctrl+K xoá một dòng), lưu bằng Ctrl+O rồi Enter, thoát bằng Ctrl+X. Rồi chạy kill -9 $$ để đóng terminal này mà không ghi lại lịch sử. 3. Muốn một lệnh không bị lưu, gõ dấu cách ở đầu: zsh cần setopt HIST_IGNORE_SPACE trong ~/.zshrc, bash cần HISTCONTROL=ignorespace trong ~/.bashrc."
author: the-last-devops
tests:
  - {"item": {"file": "/h/.zsh_history", "kind": "github-pat", "family": "token", "count": 3}, "expect": true}
  - {"item": {"file": "/h/.zsh_history", "kind": "private_key", "family": "token", "count": 1}, "expect": true}
  - {"item": {"file": "/h/.zsh_history", "kind": "password_flag", "family": "password", "count": 3}, "expect": false}
