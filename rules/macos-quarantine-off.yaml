id: macos-quarantine-off
severity: high
platforms: [macos]
source: posture
match: "has(item.quarantine) && !item.quarantine"
title:
  en: "Download quarantine is turned off"
  vi: "Đã tắt cách ly file tải về (quarantine)"
check:
  en: "Download quarantine is on"
  vi: "Cách ly file tải về đang bật"
explain:
  en: "Files you download are not marked, so Gatekeeper never checks them before they run."
  vi: "File tải về không được đánh dấu, nên Gatekeeper không kiểm tra chúng trước khi chạy."
fix:
  en: "Run: `defaults delete com.apple.LaunchServices LSQuarantine`, then log out and back in."
  vi: "Chạy: `defaults delete com.apple.LaunchServices LSQuarantine`, rồi đăng xuất và đăng nhập lại."
author: the-last-devops
tests:
  - {"item": {"os": "macos", "quarantine": false}, "expect": true}
  - {"item": {"os": "macos", "quarantine": true}, "expect": false}
