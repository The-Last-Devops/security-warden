id: git-insecure-url-rewrite
severity: medium
platforms: [macos, windows, linux]
source: git_config
match: "item.insteadof_downgrade || item.file_protocol_always"
title:
  en: "Git rewrites URLs to an unencrypted protocol"
  vi: "Git đổi URL sang giao thức không mã hoá"
check:
  en: "Git never downgrades to unencrypted URLs"
  vi: "Git không đổi sang URL không mã hoá"
explain:
  en: "A url.*.insteadOf rule sends Git traffic over http:// or git://, or protocol.file.allow is always."
  vi: "Rule url.*.insteadOf đưa lưu lượng Git qua http:// hoặc git://, hoặc protocol.file.allow đang là always."
fix:
  en: "Remove the rule: git config --global --list | grep -i insteadof"
  vi: "Xoá rule đó: git config --global --list | grep -i insteadof"
author: the-last-devops
tests:
  - {"item": {"credential_store": false, "ssl_verify_off": false, "safe_directory_all": false, "hooks_path": "", "insteadof_downgrade": true, "file_protocol_always": false}, "expect": true}
  - {"item": {"credential_store": false, "ssl_verify_off": false, "safe_directory_all": false, "hooks_path": "", "insteadof_downgrade": false, "file_protocol_always": false}, "expect": false}
