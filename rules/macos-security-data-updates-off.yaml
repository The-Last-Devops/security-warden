id: macos-security-data-updates-off
severity: high
platforms: [macos]
source: posture
match: "has(item.security_data_updates) && !item.security_data_updates"
title:
  en: "XProtect and security responses do not update"
  vi: "XProtect và bản vá phản hồi nhanh không tự cập nhật"
check:
  en: "XProtect and security responses update"
  vi: "XProtect và phản hồi bảo mật tự cập nhật"
explain:
  en: "Install Security Responses and system files is off, so the built-in malware definitions go stale."
  vi: "Mục cài phản hồi bảo mật và file hệ thống đang tắt, nên dữ liệu nhận diện mã độc có sẵn của macOS bị cũ."
fix:
  en: "System Settings > General > Software Update > Automatic Updates: turn on Install Security Responses and system files."
  vi: "Cài đặt hệ thống > Cài đặt chung > Cập nhật phần mềm > Cập nhật tự động: bật Cài đặt phản hồi bảo mật và file hệ thống."
author: the-last-devops
tests:
  - {"item": {"os": "macos", "security_data_updates": false}, "expect": true}
  - {"item": {"os": "macos", "security_data_updates": true}, "expect": false}
