id: editor-untrusted-files-open
severity: low
platforms: [macos, windows, linux]
source: editor_settings
match: "item.untrusted_files_open"
title:
  en: "{editor} opens loose files as trusted without asking"
  vi: "{editor} mở file lẻ như đáng tin mà không hỏi"
check:
  en: "VS Code and Cursor ask before trusting a loose file"
  vi: "VS Code, Cursor hỏi trước khi tin một file lẻ"
explain:
  en: "security.workspace.trust.untrustedFiles is \"open\" in {file}: files from untrusted places open in a trusted window."
  vi: "security.workspace.trust.untrustedFiles đang là \"open\" trong {file}: file từ nơi không tin cậy được mở trong cửa sổ đáng tin."
fix:
  en: "Set it to \"prompt\" (the default)."
  vi: "Đặt thành \"prompt\" (mặc định)."
author: the-last-devops
tests:
  - {"item": {"editor": "VS Code", "file": "/h/settings.json", "secret_settings": "", "workspace_trust_off": false, "untrusted_files_open": true, "auto_tasks_on": false, "proxy_strict_ssl_off": false, "extension_updates_off": false, "has_secret": false}, "expect": true}
  - {"item": {"editor": "VS Code", "file": "/h/settings.json", "secret_settings": "", "workspace_trust_off": false, "untrusted_files_open": false, "auto_tasks_on": false, "proxy_strict_ssl_off": false, "extension_updates_off": false, "has_secret": false}, "expect": false}
