id: linux-updates-pending
severity: low
platforms: [linux]
source: outdated_software
match: item.kind == "packages" && item.security <= 0 && item.total >= 10 && item.total < 50
title:
  en: "{total} package updates are waiting to be installed"
  vi: "Có {total} bản cập nhật gói đang chờ cài"
check:
  en: "Linux packages are up to date"
  vi: "Các gói Linux đã được cập nhật"
explain:
  en: "{manager} lists {total} packages with a newer version. Bug and security fixes pile up the longer updates wait. The count comes from the package list saved at the last refresh, so the real number may be higher."
  vi: "{manager} có {total} gói đã có bản mới hơn. Càng để lâu, bản sửa lỗi và vá bảo mật càng dồn lại. Con số lấy từ danh sách gói lưu ở lần làm mới gần nhất, nên thực tế có thể còn nhiều hơn."
fix:
  en: "Run: {upgrade_command} (needs your sudo password)."
  vi: "Chạy: {upgrade_command} (cần mật khẩu sudo)."
author: the-last-devops
tests:
  - {item: {kind: packages, manager: dnf, total: 30, security: -1, cache_days: 2, upgrade_command: "sudo dnf upgrade --refresh"}, expect: true}
  - {item: {kind: packages, manager: apt, total: 4, security: 0, cache_days: 0, upgrade_command: "sudo apt update && sudo apt upgrade"}, expect: false}
  - {item: {kind: packages, manager: apt, total: 20, security: 3, cache_days: 0, upgrade_command: "sudo apt update && sudo apt upgrade"}, expect: false, note: linux-security-updates-pending covers it}
  - {item: {kind: packages, manager: apt, total: 80, security: 0, cache_days: 0, upgrade_command: "sudo apt update && sudo apt upgrade"}, expect: false, note: linux-updates-pending-many covers it}
