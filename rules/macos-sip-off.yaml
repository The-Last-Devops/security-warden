id: macos-sip-off
severity: high
platforms: [macos]
source: posture
match: has(item.sip) && !item.sip
title:
  en: System Integrity Protection is off
  vi: System Integrity Protection (SIP) đang tắt
check:
  en: "System Integrity Protection is on"
  vi: "System Integrity Protection đang bật"
explain:
  en: Malware running as admin can modify macOS itself and hide there.
  vi: Mã độc có quyền admin sửa được chính macOS và ẩn mình trong đó.
fix:
  en: "1. Start up in Recovery (Apple silicon: hold the power button until Loading startup options, then Options; Intel: hold Cmd+R while starting). 2. Open Utilities › Terminal, run `csrutil enable`, then restart."
  vi: "1. Khởi động vào Recovery (Apple silicon: giữ nút nguồn tới khi thấy Đang tải tuỳ chọn khởi động, chọn Tuỳ chọn; Intel: giữ Cmd+R khi khởi động). 2. Mở Tiện ích › Terminal, chạy `csrutil enable`, rồi khởi động lại."
author: the-last-devops
tests:
  - {item: {sip: false}, expect: true}
  - {item: {sip: true}, expect: false}
