id: mcp-plain-http
severity: high
platforms: [macos, windows, linux]
source: ai_agents
match: "item.kind == \"mcp\" && item.plain_http"
title:
  en: "{tool} talks to MCP server {server} over plain HTTP"
  vi: "{tool} kết nối MCP server {server} qua HTTP không mã hoá"
check:
  en: "MCP servers use encrypted connections"
  vi: "MCP server dùng kết nối mã hoá"
explain:
  en: "Prompts, code and tokens sent to {server} can be read or changed on the way."
  vi: "Prompt, code và token gửi tới {server} có thể bị đọc hoặc sửa trên đường đi."
fix:
  en: "Open {file}, find the server \"{server}\" and change its url from http:// to https:// (ask the server's owner if it has no https address). Then restart {tool}."
  vi: "Mở {file}, tìm server \"{server}\" và đổi url từ http:// sang https:// (hỏi chủ server nếu nó chưa có địa chỉ https). Rồi khởi động lại {tool}."
author: the-last-devops
tests:
  - {"item": {"kind": "mcp", "tool": "Claude Code", "file": "/h/.claude.json", "server": "github", "secret_keys": "", "has_secret": false, "plain_http": true, "unpinned_npx": false, "world_readable": false}, "expect": true}
  - {"item": {"kind": "mcp", "tool": "Claude Code", "file": "/h/.claude.json", "server": "github", "secret_keys": "", "has_secret": false, "plain_http": false, "unpinned_npx": false, "world_readable": false}, "expect": false}
