id: pip-extra-index-url
severity: medium
platforms: [macos, windows, linux]
source: pkg_config
match: "item.extra_index"
title:
  en: "pip mixes a private and a public index"
  vi: "pip trộn index riêng và index công khai"
check:
  en: "pip uses a single package index"
  vi: "pip dùng một nguồn gói duy nhất"
explain:
  en: "extra-index-url lets a public package with the same name as your private one win (dependency confusion)."
  vi: "extra-index-url khiến gói công khai trùng tên gói nội bộ có thể được cài thay (dependency confusion)."
fix:
  en: "Open {file} and delete the extra-index-url line (pip config list shows what is set). Install private packages from a single index-url that proxies PyPI (Artifactory, Nexus, devpi), or pin hashes with --require-hashes."
  vi: "Mở {file} và xoá dòng extra-index-url (pip config list cho biết đang đặt gì). Cài gói nội bộ qua một index-url duy nhất có làm proxy cho PyPI (Artifactory, Nexus, devpi), hoặc khoá mã băm bằng --require-hashes."
author: the-last-devops
tests:
  - {"item": {"tool": "pip", "file": "/h/.npmrc", "strict_ssl_off": false, "http_registry": false, "trusted_host": false, "extra_index": true}, "expect": true}
  - {"item": {"tool": "pip", "file": "/h/.npmrc", "strict_ssl_off": false, "http_registry": false, "trusted_host": false, "extra_index": false}, "expect": false}
