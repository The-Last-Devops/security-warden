id: git-credential-store
severity: medium
platforms: [macos, windows, linux]
source: git_config
match: "item.credential_store"
title:
  en: "Git saves passwords in plain text"
  vi: "Git lưu mật khẩu không mã hoá"
check:
  en: "Git does not store passwords in plain text"
  vi: "Git không lưu mật khẩu dạng chữ thường"
explain:
  en: "credential.helper store writes every Git password and token to ~/.git-credentials."
  vi: "credential.helper store ghi mọi mật khẩu và token Git vào ~/.git-credentials."
fix:
  en: "macOS: git config --global credential.helper osxkeychain. Linux: libsecret or git-credential-manager. Then delete ~/.git-credentials."
  vi: "macOS: git config --global credential.helper osxkeychain. Linux: libsecret hoặc git-credential-manager. Rồi xoá ~/.git-credentials."
author: the-last-devops
tests:
  - {"item": {"credential_store": true, "ssl_verify_off": false, "safe_directory_all": false, "hooks_path": "", "insteadof_downgrade": false, "file_protocol_always": false}, "expect": true}
  - {"item": {"credential_store": false, "ssl_verify_off": false, "safe_directory_all": false, "hooks_path": "", "insteadof_downgrade": false, "file_protocol_always": false}, "expect": false}
