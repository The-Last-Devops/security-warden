id: software-outdated-exposed
severity: high
platforms: [macos, linux]
source: outdated_software
match: item.kind == "running" && item.reachable
title:
  en: "Out-of-date {name} {version} accepts connections from other machines"
  vi: "{name} {version} đã cũ mà vẫn nhận kết nối từ máy khác"
explain:
  en: "A newer version ({latest}) is available. Old versions of network-facing software are the easiest way in, because their bugs are public."
  vi: "Đã có bản mới ({latest}). Phần mềm mở ra mạng mà dùng bản cũ là cửa dễ vào nhất, vì lỗi của nó đã công khai."
fix:
  en: "brew upgrade {name}, then restart it (brew services restart {name})."
  vi: "brew upgrade {name}, rồi khởi động lại (brew services restart {name})."
author: the-last-devops
tests:
  - {item: {kind: running, name: redis, version: "7.2.4", latest: "7.4.1", reachable: true}, expect: true}
  - {item: {kind: running, name: redis, version: "7.2.4", latest: "7.4.1", reachable: false}, expect: false}
  - {item: {kind: summary, total: 30}, expect: false}
