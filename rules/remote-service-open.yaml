id: remote-service-open
severity: medium
platforms: [macos, windows, linux]
source: remote_services
match: item.open && item.service != "smb"
title:
  en: "Remote access is on: {service} (port {port})"
  vi: "Đang bật truy cập từ xa: {service} (port {port})"
check:
  en: "Remote login services are off"
  vi: "Dịch vụ đăng nhập từ xa đang tắt"
explain:
  en: "This machine accepts {service} logins from the network. If a password is weak or reused, someone can take over the machine."
  vi: "Máy này nhận đăng nhập {service} từ mạng. Mật khẩu yếu hoặc dùng lại ở nơi khác là người ngoài chiếm được máy."
fix:
  en: "If you don't use {service}, turn it off (never the one you are connected through): macOS System Settings › General › Sharing › Remote Login (ssh), Screen Sharing, Remote Management or Remote Apple Events: off. Windows (rdp): Settings › System › Remote Desktop › Off. Linux (ssh), only while sitting at the machine: sudo systemctl disable --now ssh.socket ssh (Fedora: sudo systemctl disable --now sshd)."
  vi: "Nếu không dùng {service}, hãy tắt (đừng tắt cái bạn đang dùng để kết nối): macOS Cài đặt hệ thống › Cài đặt chung › Chia sẻ › Đăng nhập từ xa (ssh), Chia sẻ màn hình, Quản lý từ xa hoặc Sự kiện Apple từ xa: tắt. Windows (rdp): Settings › System › Remote Desktop › Off. Linux (ssh), chỉ khi đang ngồi trước máy: sudo systemctl disable --now ssh.socket ssh (Fedora: sudo systemctl disable --now sshd)."
author: the-last-devops
tests:
  - {item: {service: ssh, port: 22, open: true}, expect: true}
  - {item: {service: ssh, port: 22, open: false}, expect: false}
  - {item: {service: smb, port: 445, open: true}, expect: false, note: covered by its own rule later}
