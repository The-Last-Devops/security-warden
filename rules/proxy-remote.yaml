id: proxy-remote
severity: high
platforms: [macos, windows, linux]
source: network_config
match: "item.kind == \"proxy\" && !item.loopback"
title:
  en: "Traffic goes through a {type} proxy: {host}"
  vi: "Lưu lượng đi qua proxy {type}: {host}"
check:
  en: "No unknown system proxy"
  vi: "Không có proxy hệ thống lạ"
explain:
  en: "A system proxy at {host} can read or change your web traffic. Make sure it is your company's or your own."
  vi: "Proxy hệ thống ở {host} đọc hoặc sửa được lưu lượng web của bạn. Hãy chắc nó là của công ty hoặc của bạn."
fix:
  en: "If you don't know {host}: macOS System Settings › Network › (your network) › Details › Proxies, turn the proxies off; Windows Settings › Network & internet › Proxy, turn off Use a proxy server; Linux GNOME Settings › Network › Network Proxy › Off. Also look for HTTP_PROXY / HTTPS_PROXY in your shell profile."
  vi: "Nếu bạn không biết {host}: macOS Cài đặt hệ thống › Mạng › (mạng đang dùng) › Chi tiết › Proxy, tắt các proxy; Windows Settings › Network & internet › Proxy, tắt Use a proxy server; Linux GNOME Cài đặt › Mạng › Proxy mạng › Tắt. Kiểm tra thêm HTTP_PROXY / HTTPS_PROXY trong tệp cấu hình shell."
author: the-last-devops
tests:
  - {"item": {"kind": "proxy", "type": "http", "host": "proxy.example", "loopback": false}, "expect": true}
  - {"item": {"kind": "proxy", "type": "http", "host": "127.0.0.1:8888", "loopback": true}, "expect": false}
