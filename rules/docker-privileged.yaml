id: docker-privileged
severity: high
platforms: [macos, windows, linux]
source: docker_containers
match: item.privileged || item.mounts_docker_sock
title:
  en: "Container {container} has full control of Docker"
  vi: "Container {container} có toàn quyền trên máy (privileged)"
check:
  en: "No privileged containers or docker.sock mounts"
  vi: "Không container privileged hay mount docker.sock"
explain:
  en: "{container} ({image}) runs privileged or mounts docker.sock. If it is compromised, the attacker controls every container and the Docker host."
  vi: "{container} ({image}) chạy privileged hoặc mount docker.sock. Nó bị chiếm là kẻ tấn công điều khiển được mọi container và máy chạy Docker."
fix:
  en: "Remove privileged: true and the docker.sock volume unless the container really manages Docker."
  vi: "Bỏ privileged: true và volume docker.sock, trừ khi container đó thật sự quản lý Docker."
author: the-last-devops
tests:
  - {item: {container: a, image: x, privileged: true, mounts_docker_sock: false}, expect: true}
  - {item: {container: a, image: x, privileged: false, mounts_docker_sock: true}, expect: true}
  - {item: {container: a, image: x, privileged: false, mounts_docker_sock: false}, expect: false}
