id: project-dependency-vulnerable-moderate
severity: medium
platforms: [macos, windows, linux]
source: project_deps
match: "!item.severe && item.fixed != \"\""
title:
  en: "Library with a known vulnerability: {repo_name} · {package} {version} → {fixed}"
  vi: "Thư viện có lỗ hổng: {repo_name} · {package} {version} → {fixed}"
check:
  en: "No project dependency with a known vulnerability"
  vi: "Không thư viện nào trong dự án có lỗ hổng đã biết"
explain:
  en: "{lockfile} in {repo} pins {package} {version} ({ecosystem}), which has a published vulnerability: {ids}. Vulnerable packages in this repo: {packages}, none rated high or critical. Matched offline against the OSV database (osv.dev); nothing about your projects was sent."
  vi: "{lockfile} trong {repo} đang dùng {package} {version} ({ecosystem}), bản này có lỗ hổng đã công bố: {ids}. Số thư viện có lỗ hổng trong repo này: {packages}, không cái nào ở mức cao hay nghiêm trọng. Đối chiếu ngay trên máy với dữ liệu OSV (osv.dev); không gửi gì về dự án của bạn ra ngoài."
fix:
  en: "1. `cd {project} && {upgrade_cmd}` 2. If it stays below {fixed}, another package pulls it in. To see which: `cd {project} && {why}`, then upgrade that one. 3. Run the tests and commit the lock file."
  vi: "1. `cd {project} && {upgrade_cmd}` 2. Nếu vẫn chưa lên {fixed} thì nó đi kèm một thư viện khác. Xem là thư viện nào: `cd {project} && {why}`, rồi nâng thư viện đó. 3. Chạy test và commit file lock."
author: the-last-devops
tests:
  - {"item": {"repo": "/h/Code/api", "repo_name": "api", "project": "/h/Code/api", "lockfile": "requirements.txt", "ecosystem": "PyPI", "package": "requests", "version": "2.31.0", "fixed": "2.32.0", "ids": "CVE-2024-35195", "more_ids": 0, "severity": "moderate", "severe": false, "packages": 1, "others": 0, "upgrade_cmd": "pip install 'requests>=2.32.0'", "why": "pip show requests"}, "expect": true}
  - {"item": {"repo": "/h/Code/api", "repo_name": "api", "project": "/h/Code/api", "lockfile": "requirements.txt", "ecosystem": "PyPI", "package": "requests", "version": "2.31.0", "fixed": "2.32.0", "ids": "CVE-2024-35195", "more_ids": 0, "severity": "high", "severe": true, "packages": 1, "others": 0, "upgrade_cmd": "pip install 'requests>=2.32.0'", "why": "pip show requests"}, "expect": false}
