id: macos-guest-account-on
severity: low
platforms: [macos]
source: posture
match: has(item.guest_account) && item.guest_account
title:
  en: Guest account is on
  vi: Tài khoản khách đang bật
check:
  en: "Guest account is off"
  vi: "Tài khoản khách đang tắt"
explain:
  en: Anyone can log in to this machine without a password and use its network.
  vi: Ai cũng đăng nhập được máy này không cần mật khẩu và dùng mạng của nó.
fix:
  en: "Press Fix to do it automatically, or: System Settings › Users & Groups › Guest User › turn off Allow guests to log in to this computer."
  vi: "Bấm Sửa để tự sửa, hoặc: Cài đặt hệ thống › Người dùng & Nhóm › Người dùng khách › tắt Cho phép khách đăng nhập vào máy tính này."
author: the-last-devops
tests:
  - {item: {guest_account: true}, expect: true}
  - {item: {guest_account: false}, expect: false}
remedy: {action: macos_guest_off}
