id: docker-image-old
severity: medium
platforms: [macos, windows, linux]
source: docker_containers
match: "item.image_age_days > 180"
title:
  en: "Container {container} runs an image built {image_age_days} days ago"
  vi: "Container {container} chạy image build từ {image_age_days} ngày trước"
check:
  en: "Running containers use images built in the last 6 months"
  vi: "Container đang chạy dùng image build trong 6 tháng gần đây"
explain:
  en: "{image} has not been rebuilt for more than six months, so the system libraries inside it miss half a year of security fixes, whatever the app version."
  vi: "{image} đã hơn sáu tháng chưa build lại, nên thư viện hệ thống bên trong thiếu nửa năm bản vá bảo mật, dù app là phiên bản nào."
fix:
  en: "Pull or rebuild a current image (docker compose pull && docker compose up -d, or docker build --pull), or move to a maintained tag of {image}."
  vi: "Kéo về hoặc build lại image mới (docker compose pull && docker compose up -d, hoặc docker build --pull), hoặc chuyển sang tag còn được duy trì của {image}."
author: the-last-devops
tests:
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": false, "host_pid": false, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "", "user": "app", "runs_as_root": false, "image_age_days": 400, "latest_tag": false}, "expect": true}
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": false, "host_pid": false, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "", "user": "app", "runs_as_root": false, "image_age_days": 30, "latest_tag": false}, "expect": false}
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": false, "host_pid": false, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "", "user": "app", "runs_as_root": false, "image_age_days": -1, "latest_tag": false}, "expect": false, "note": "build date unknown"}
