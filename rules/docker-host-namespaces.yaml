id: docker-host-namespaces
severity: high
platforms: [macos, windows, linux]
source: docker_containers
match: "item.host_network || item.host_pid || item.host_ipc"
title:
  en: "Container {container} shares the host's network or processes"
  vi: "Container {container} dùng chung mạng hoặc tiến trình với máy chủ"
check:
  en: "No container shares the host network or processes"
  vi: "Không container nào dùng chung mạng hay tiến trình với máy"
explain:
  en: "{container} runs with --network host, --pid host or --ipc host. It sees every port and process of this machine, and every port it opens is open on the machine."
  vi: "{container} chạy với --network host, --pid host hoặc --ipc host. Nó thấy mọi port và tiến trình của máy, và port nó mở cũng là port của máy."
fix:
  en: "Remove network_mode/pid/ipc: host and publish only the ports you need on 127.0.0.1."
  vi: "Bỏ network_mode/pid/ipc: host và chỉ publish port cần thiết lên 127.0.0.1."
author: the-last-devops
tests:
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": true, "host_pid": false, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "", "user": "app", "runs_as_root": false}, "expect": true}
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": false, "host_pid": true, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "", "user": "app", "runs_as_root": false}, "expect": true}
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": false, "host_pid": false, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "", "user": "app", "runs_as_root": false}, "expect": false}
