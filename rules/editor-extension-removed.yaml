id: editor-extension-removed
severity: high
platforms: [macos, windows, linux]
source: editor_extensions
match: "item.removed_type != \"\" && item.removed_type != \"Malware\""
title:
  en: "{editor} extension removed from the Marketplace: {extension} ({removed_type})"
  vi: "Extension {editor} đã bị Marketplace gỡ: {extension} ({removed_type})"
check:
  en: "No installed extension was removed from the Marketplace for safety reasons"
  vi: "Không extension nào đang cài từng bị Marketplace gỡ vì lý do an toàn"
explain:
  en: "Microsoft removed {extension} from the VS Code Marketplace ({removed_type}): it pretended to be another extension or could not be trusted. It is still installed and runs with your full permissions."
  vi: "Microsoft đã gỡ {extension} khỏi VS Code Marketplace ({removed_type}): nó giả danh một extension khác hoặc không đáng tin. Nó vẫn đang cài và chạy với toàn quyền của bạn."
fix:
  en: "Uninstall it (Extensions panel, or code --uninstall-extension {extension}) and install the real extension from its known publisher if you need it."
  vi: "Gỡ nó (bảng Extensions, hoặc code --uninstall-extension {extension}) và cài extension thật từ đúng nhà phát hành nếu bạn cần."
references:
  - https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
author: the-last-devops
tests:
  - {"item": {"editor": "VS Code", "extension": "fake.tool", "version": "1.0.0", "from_file": false, "removed_type": "Impersonation"}, "expect": true}
  - {"item": {"editor": "VS Code", "extension": "odd.tool", "version": "1.0.0", "from_file": false, "removed_type": "Untrustworthy"}, "expect": true}
  - {"item": {"editor": "VS Code", "extension": "evil.tool", "version": "1.0.0", "from_file": false, "removed_type": "Malware"}, "expect": false}
  - {"item": {"editor": "VS Code", "extension": "acme.tool", "version": "1.0.0", "from_file": false, "removed_type": ""}, "expect": false}
