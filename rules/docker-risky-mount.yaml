id: docker-risky-mount
severity: high
platforms: [macos, windows, linux]
source: docker_containers
match: "item.risky_mount != \"\""
title:
  en: "Container {container} can read {risky_mount} on this machine"
  vi: "Container {container} đọc được {risky_mount} trên máy này"
explain:
  en: "{container} ({image}) mounts {risky_mount} from the host. Anything that breaks into the container gets your files, keys or system configuration."
  vi: "{container} ({image}) mount {risky_mount} từ máy chủ. Thứ gì lọt được vào container là lấy được file, khoá hoặc cấu hình hệ thống của bạn."
fix:
  en: "Mount only the project folder it needs, read-only where possible (-v ./data:/data:ro)."
  vi: "Chỉ mount đúng thư mục dự án cần, để chỉ đọc nếu được (-v ./data:/data:ro)."
author: the-last-devops
tests:
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": false, "host_pid": false, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "/Users/a/.ssh", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "", "user": "app", "runs_as_root": false}, "expect": true}
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": false, "host_pid": false, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "", "user": "app", "runs_as_root": false}, "expect": false}
