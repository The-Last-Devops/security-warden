id: port-listening-all-interfaces
severity: medium
platforms: [macos, windows, linux]
source: listening_ports
# Tailscale's own listeners serve the tailnet; the tailscale-* rules cover them.
match: item.reachable && !item.system_binary && !(item.process in ["IPNExtension", "tailscaled"])
  && item.service == ""
  && !(item.port in [22, 445, 3283, 3389, 5900])
title:
  en: "{process} accepts connections on port {port} from other machines"
  vi: "{process} nhận kết nối vào port {port} từ máy khác"
check:
  en: "No app accepts connections from other machines"
  vi: "Không app nào nhận kết nối từ máy khác"
explain:
  en: "Other machines on the same network (office, café Wi-Fi, VPN) can connect to port {port}. Dev servers rarely need that."
  vi: "Máy khác cùng mạng (văn phòng, Wi-Fi quán, VPN) kết nối được vào port {port}. Server dev hiếm khi cần vậy."
fix:
  en: "See what it is: lsof -nP -iTCP:{port} -sTCP:LISTEN (Windows: netstat -ano | findstr :{port}). If you don't need it, quit {process}. If it is your dev server, start it on 127.0.0.1 (often --host 127.0.0.1 or HOST=127.0.0.1; see its docs). If others on the network really need it, keep the firewall on."
  vi: "Xem đó là gì: lsof -nP -iTCP:{port} -sTCP:LISTEN (Windows: netstat -ano | findstr :{port}). Nếu không cần, thoát {process}. Nếu là server phát triển của bạn, chạy nó trên 127.0.0.1 (thường là --host 127.0.0.1 hoặc HOST=127.0.0.1; xem tài liệu của nó). Nếu người khác trong mạng thật sự cần, hãy giữ tường lửa bật."
author: the-last-devops
tests:
  - {item: {process: node, port: 3000, reachable: true, system_binary: false, service: ""}, expect: true}
  - {item: {process: node, port: 3000, reachable: true, system_binary: false, service: "", address: 192.168.1.5}, expect: true, note: bound to a LAN address}
  - {item: {process: node, port: 3000, reachable: false, system_binary: false, service: ""}, expect: false, note: loopback}
  - {item: {process: rapportd, port: 55326, reachable: true, system_binary: true, service: ""}, expect: false, note: part of macOS}
  - {item: {process: postgres, port: 5432, reachable: true, system_binary: false, service: PostgreSQL}, expect: false, note: covered by service-reachable}
  - {item: {process: sshd, port: 22, reachable: true, system_binary: false, service: ""}, expect: false, note: remote-service-open covers it}
  - {item: {process: IPNExtension, port: 63169, reachable: true, system_binary: false, service: ""}, expect: false, note: Tailscale peer API}
