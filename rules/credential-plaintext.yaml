id: credential-plaintext
severity: low
platforms: [macos, windows, linux]
source: credential_files
match: item.plaintext_secret && item.kind != "aws"
title:
  en: "Secret stored in plain text: {path}"
  vi: "Secret lưu dạng chữ thường: {path}"
explain:
  en: "{path} ({kind}) keeps a token or password in plain text. Any program running as you, or any backup of your home folder, can read it."
  vi: "{path} ({kind}) giữ token hoặc mật khẩu dạng chữ thường. Chương trình nào chạy dưới tên bạn, hay bản backup thư mục home, cũng đọc được."
fix:
  en: "Prefer a credential helper that uses the macOS Keychain (git credential-osxkeychain, docker credsStore, gh auth login)."
  vi: "Nên dùng credential helper lưu vào Keychain của macOS (git credential-osxkeychain, credsStore của docker, gh auth login)."
author: the-last-devops
tests:
  - {item: {kind: git_credentials, path: /h/.git-credentials, plaintext_secret: true}, expect: true}
  - {item: {kind: aws, path: /h/.aws/credentials, plaintext_secret: true}, expect: false, note: has its own rule}
  - {item: {kind: npm, path: /h/.npmrc, plaintext_secret: false}, expect: false}
