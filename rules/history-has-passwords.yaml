id: history-has-passwords
severity: medium
platforms: [macos, linux]
source: shell_history
match: "item.kind in [\"password_flag\", \"bearer\", \"url_with_password\"]"
title:
  en: "{count} passwords or auth headers in {file}"
  vi: "{count} mật khẩu hoặc header xác thực trong {file}"
check:
  en: "No passwords in shell history"
  vi: "Không có mật khẩu trong lịch sử shell"
explain:
  en: "Passwords typed on the command line ({kind}) are saved in plain text in your history."
  vi: "Mật khẩu gõ trên dòng lệnh ({kind}) được lưu dạng chữ thường trong lịch sử."
fix:
  en: "1. Change those passwords first. 2. Close all other terminal windows. Run nano {file}, delete those lines (Ctrl+K deletes a line), save with Ctrl+O then Enter, quit with Ctrl+X. Then run kill -9 $$ to close this terminal without writing its history back. 3. Next time, type passwords at the prompt or keep them in an env file, not in the command."
  vi: "1. Đổi các mật khẩu đó trước. 2. Đóng mọi cửa sổ terminal khác. Chạy nano {file}, xoá các dòng đó (Ctrl+K xoá một dòng), lưu bằng Ctrl+O rồi Enter, thoát bằng Ctrl+X. Rồi chạy kill -9 $$ để đóng terminal này mà không ghi lại lịch sử. 3. Lần sau, gõ mật khẩu khi được hỏi hoặc để trong tệp env, đừng viết vào lệnh."
author: the-last-devops
tests:
  - {"item": {"file": "/h/.zsh_history", "kind": "password_flag", "family": "password", "count": 3}, "expect": true}
  - {"item": {"file": "/h/.zsh_history", "kind": "github-pat", "family": "token", "count": 3}, "expect": false}
