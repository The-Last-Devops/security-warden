id: history-has-passwords
severity: medium
platforms: [macos, linux]
source: shell_history
match: "item.kind in [\"password_flag\", \"bearer\", \"url_with_password\"]"
title:
  en: "{count} passwords or auth headers in {file}"
  vi: "{count} mật khẩu hoặc header xác thực trong {file}"
explain:
  en: "Passwords typed on the command line ({kind}) are saved in plain text in your history."
  vi: "Mật khẩu gõ trên dòng lệnh ({kind}) được lưu dạng chữ thường trong lịch sử."
fix:
  en: "Delete those lines from {file} and change the passwords. Use prompts or env files instead of putting passwords in commands."
  vi: "Xoá các dòng đó khỏi {file} và đổi mật khẩu. Hãy để chương trình hỏi mật khẩu thay vì gõ thẳng vào lệnh."
author: the-last-devops
tests:
  - {"item": {"file": "/h/.zsh_history", "kind": "password_flag", "count": 3}, "expect": true}
  - {"item": {"file": "/h/.zsh_history", "kind": "github_token", "count": 3}, "expect": false}
