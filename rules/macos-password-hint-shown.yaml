id: macos-password-hint-shown
severity: low
platforms: [macos]
source: posture
match: "has(item.password_hint_shown) && item.password_hint_shown"
title:
  en: "The login window shows your password hint"
  vi: "Màn hình đăng nhập hiện gợi ý mật khẩu của bạn"
check:
  en: "The login window shows no password hint"
  vi: "Màn hình đăng nhập không hiện gợi ý mật khẩu"
explain:
  en: "Your account has a password hint and the login window shows it after a few wrong tries. A hint helps whoever has the Mac in their hands guess the password."
  vi: "Tài khoản của bạn có gợi ý mật khẩu và màn hình đăng nhập hiện nó sau vài lần nhập sai. Gợi ý giúp người đang cầm máy đoán ra mật khẩu."
fix:
  en: "System Settings › Lock Screen, and turn off Show password hints (or remove the hint: change your password and leave the hint empty)."
  vi: "Cài đặt hệ thống › Màn hình khoá, và tắt Hiển thị gợi ý mật khẩu (hoặc xoá gợi ý: đổi mật khẩu và để trống ô gợi ý)."
references:
  - https://github.com/usnistgov/macos_security
author: the-last-devops
tests:
  - {"item": {"os": "macos", "password_hint_shown": true}, "expect": true}
  - {"item": {"os": "macos", "password_hint_shown": false}, "expect": false}
