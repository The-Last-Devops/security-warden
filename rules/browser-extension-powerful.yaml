id: browser-extension-powerful
severity: high
platforms: [macos, windows, linux]
source: browser_extensions
match: "item.all_urls && (item.debugger || item.proxy)"
title:
  en: "{browser} extension {name} can control every site you visit"
  vi: "Extension {name} trên {browser} điều khiển được mọi trang bạn mở"
check:
  en: "No extension can control every site"
  vi: "Không extension nào điều khiển được mọi trang"
explain:
  en: "It can read and change all pages and also attach a debugger or reroute your traffic (profile {profile})."
  vi: "Nó đọc và sửa được mọi trang, lại còn gắn debugger hoặc lái lưu lượng của bạn đi nơi khác (hồ sơ {profile})."
fix:
  en: "Unless you rely on {name}: in {browser} open chrome://extensions, find {name} and click Remove."
  vi: "Nếu không thật sự cần {name}: trong {browser} mở chrome://extensions, tìm {name} và bấm Remove (Xoá)."
author: the-last-devops
tests:
  - {"item": {"browser": "Chrome", "profile": "Default", "id": "abc", "name": "Helper", "unpacked": false, "from_webstore": true, "external": false, "all_urls": true, "debugger": true, "proxy": false, "native": false, "cookies": false, "web_request_blocking": false}, "expect": true}
  - {"item": {"browser": "Chrome", "profile": "Default", "id": "abc", "name": "Helper", "unpacked": false, "from_webstore": true, "external": false, "all_urls": true, "debugger": false, "proxy": true, "native": false, "cookies": false, "web_request_blocking": false}, "expect": true}
  - {"item": {"browser": "Chrome", "profile": "Default", "id": "abc", "name": "Helper", "unpacked": false, "from_webstore": true, "external": false, "all_urls": true, "debugger": false, "proxy": false, "native": false, "cookies": false, "web_request_blocking": false}, "expect": false}
