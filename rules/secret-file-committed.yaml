id: secret-file-committed
severity: high
platforms: [macos, windows, linux]
source: dev_files
match: "item.kind != \"truncated\" && item.kind != \"key\" && item.tracked"
title:
  en: "Secret file committed to Git: {repo_name}/{file}"
  vi: "File bí mật đã bị commit vào Git: {repo_name}/{file}"
check:
  en: "No .env or secret files committed to Git"
  vi: "Không file .env hay file bí mật nào bị commit"
explain:
  en: "{file} ({kind}) is tracked in {repo}. Everyone with the repository, and its whole history, has it."
  vi: "{file} ({kind}) đang được Git theo dõi trong {repo}. Ai có repo, kể cả lịch sử, đều có file này."
fix:
  en: "git rm --cached {file}, add it to .gitignore, then rotate every secret it held (removing it later does not erase history)."
  vi: "git rm --cached {file}, thêm vào .gitignore, rồi đổi mọi secret trong đó (xoá sau không xoá được lịch sử)."
author: the-last-devops
tests:
  - {"item": {"path": "/h/Code/app/.env", "repo": "/h/Code/app", "repo_name": "app", "file": ".env", "kind": "env", "tracked": true, "ignored": false}, "expect": true}
  - {"item": {"path": "/h/Code/app/.env", "repo": "/h/Code/app", "repo_name": "app", "file": ".env", "kind": "env", "tracked": false, "ignored": true}, "expect": false}
  - {"item": {"path": "/h/Code/app/.env", "repo": "/h/Code/app", "repo_name": "app", "file": ".env", "kind": "truncated", "tracked": true, "ignored": true}, "expect": false}
  - {"item": {"path": "/h/Code/app/id.pem", "repo": "/h/Code/app", "repo_name": "app", "file": "id.pem", "kind": "key", "tracked": true, "ignored": false}, "expect": false, "note": "private-key-committed covers keys"}
