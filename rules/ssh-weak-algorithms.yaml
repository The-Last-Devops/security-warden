id: ssh-weak-algorithms
severity: low
platforms: [macos, windows, linux]
source: ssh_config
match: "item.weak_algorithm"
title:
  en: "SSH allows weak algorithms ({key})"
  vi: "SSH cho phép thuật toán yếu ({key})"
explain:
  en: "{file} line {line_no} enables legacy crypto ({value})."
  vi: "{file} dòng {line_no} bật mã hoá cũ ({value})."
fix:
  en: "Remove the setting unless an old server needs it, and then scope it to that Host."
  vi: "Bỏ thiết lập đó, trừ khi server cũ cần; khi ấy chỉ đặt cho đúng Host đó."
author: the-last-devops
tests:
  - {"item": {"file": "/h/.ssh/config", "line_no": 4, "host": "*", "all_hosts": true, "key": "hostkeyalgorithms", "value": "+ssh-dss", "weak_algorithm": true}, "expect": true}
  - {"item": {"file": "/h/.ssh/config", "line_no": 4, "host": "*", "all_hosts": true, "key": "forwardagent", "value": "yes", "weak_algorithm": false}, "expect": false}
