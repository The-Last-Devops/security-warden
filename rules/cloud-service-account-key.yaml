id: cloud-service-account-key
severity: high
platforms: [macos, windows, linux]
source: cloud_config
match: "item.sa_type == \"service_account\" || item.kind == \"azure_sp\""
title:
  en: "Long-lived cloud service account key on disk: {file}"
  vi: "Khoá service account cloud dài hạn nằm trên máy: {file}"
check:
  en: "No cloud service account keys on disk"
  vi: "Không có khoá service account cloud trên máy"
explain:
  en: "Service account keys never expire. A copy of {file} keeps working until someone disables it."
  vi: "Khoá service account không hết hạn. Một bản sao của {file} dùng được mãi tới khi có người vô hiệu hoá."
fix:
  en: "1. Open `{file}` and note `private_key_id` and `client_email`. 2. Switch to your own login: `gcloud auth application-default login` (this replaces `{file}`). 3. If only this machine uses the key, disable it, which can be undone: `gcloud iam service-accounts keys disable <private_key_id> --iam-account=<client_email>`. 4. When nothing has broken for a few days, delete it in Cloud Console › IAM & Admin › Service Accounts › Keys."
  vi: "1. Mở `{file}`, ghi lại `private_key_id` và `client_email`. 2. Chuyển sang tài khoản của chính bạn: `gcloud auth application-default login` (lệnh này thay thế `{file}`). 3. Nếu chỉ máy này dùng khoá đó, vô hiệu hoá nó, có thể bật lại: `gcloud iam service-accounts keys disable <private_key_id> --iam-account=<client_email>`. 4. Sau vài ngày không có gì hỏng, xoá khoá ở Cloud Console › IAM & Admin › Service Accounts › Keys."
author: the-last-devops
tests:
  - {"item": {"kind": "gcloud_adc", "file": "/h/.kube/config", "insecure_skip_tls": false, "static_token": false, "current_context": "dev", "current_is_prod": false, "sa_type": "service_account"}, "expect": true}
  - {"item": {"kind": "gcloud_adc", "file": "/h/.kube/config", "insecure_skip_tls": false, "static_token": false, "current_context": "dev", "current_is_prod": false, "sa_type": "authorized_user"}, "expect": false}
