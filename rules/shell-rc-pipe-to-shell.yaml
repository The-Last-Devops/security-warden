id: shell-rc-pipe-to-shell
severity: medium
platforms: [macos, linux]
source: shell_rc
match: "item.kind == \"pipe_to_shell\""
title:
  en: "{file} runs code from the internet on every shell"
  vi: "{file} chạy code từ internet mỗi lần mở shell"
check:
  en: "Shell files do not run code from the internet"
  vi: "File shell không chạy code từ internet"
explain:
  en: "Line {line_no} downloads a script and runs it each time a terminal opens. If that server is compromised, so is your machine."
  vi: "Dòng {line_no} tải script về và chạy mỗi lần mở terminal. Máy chủ đó bị chiếm là máy bạn bị chiếm theo."
fix:
  en: "1. Open `{file}` and look at line {line_no}. 2. Replace it: download the script once (`curl -fsSL <url> -o ~/<name>.sh`), read it, and `source` that local file instead; or install the tool with your package manager. 3. Open a new terminal."
  vi: "1. Mở `{file}` và xem dòng {line_no}. 2. Thay nó: tải script về một lần (`curl -fsSL <url> -o ~/<tên>.sh`), đọc qua, rồi `source` tệp trên máy thay vì tải mỗi lần; hoặc cài công cụ qua trình quản lý gói. 3. Mở terminal mới."
author: the-last-devops
tests:
  - {"item": {"kind": "pipe_to_shell", "file": "/h/.zshrc", "line_no": 12, "var_name": ""}, "expect": true}
  - {"item": {"kind": "insecure_flag", "file": "/h/.zshrc", "line_no": 12, "var_name": ""}, "expect": false}
