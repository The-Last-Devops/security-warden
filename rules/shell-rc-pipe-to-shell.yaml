id: shell-rc-pipe-to-shell
severity: medium
platforms: [macos, linux]
source: shell_rc
match: "item.kind == \"pipe_to_shell\""
title:
  en: "{file} runs code from the internet on every shell"
  vi: "{file} chạy code từ internet mỗi lần mở shell"
explain:
  en: "Line {line_no} downloads a script and runs it each time a terminal opens. If that server is compromised, so is your machine."
  vi: "Dòng {line_no} tải script về và chạy mỗi lần mở terminal. Máy chủ đó bị chiếm là máy bạn bị chiếm theo."
fix:
  en: "Download the script once, review it, and source the local copy."
  vi: "Tải script về một lần, đọc kỹ, rồi source bản trên máy."
author: the-last-devops
tests:
  - {"item": {"kind": "pipe_to_shell", "file": "/h/.zshrc", "line_no": 12, "var_name": ""}, "expect": true}
  - {"item": {"kind": "insecure_flag", "file": "/h/.zshrc", "line_no": 12, "var_name": ""}, "expect": false}
