id: secret-file-in-history
severity: high
platforms: [macos, windows, linux]
source: git_history
match: "item.count > 0"
title:
  en: "Secret file deleted but still in Git history: {repo_name}/{file}"
  vi: "File bí mật đã xoá nhưng vẫn còn trong lịch sử Git: {repo_name}/{file}"
check:
  en: "No deleted secret files left in Git history"
  vi: "Lịch sử Git không còn file bí mật nào đã xoá"
explain:
  en: "{files} ({count} in all) were committed to {repo} and later deleted or renamed. Deleting a file does not remove it from history: every clone, fork and backup of the repo can still read it with one git command."
  vi: "{files} (tổng cộng {count} file) từng được commit vào {repo} rồi bị xoá hoặc đổi tên. Xoá file không xoá được nó khỏi lịch sử: bất kỳ bản clone, fork hay bản sao lưu nào của repo vẫn đọc được nó bằng một lệnh git."
fix:
  en: "First, and this is the real fix: treat every secret those files held as leaked. Revoke or rotate each key, password and token now (git log --all -- {file} shows when it was committed). Optional, only after that, and with care: rewrite history to drop the file. Make a backup first (git clone --mirror {repo} {repo}-backup.git), then in a fresh clone run git filter-repo --invert-paths --path {file}. That rewrites every commit: pushing it needs a force push, everyone must clone again, and copies made before stay as they were."
  vi: "Trước hết, và đây mới là cách sửa thật: coi mọi secret trong các file đó là đã lộ. Thu hồi hoặc đổi từng khoá, mật khẩu và token ngay (git log --all -- {file} cho biết file được commit lúc nào). Không bắt buộc, chỉ làm sau bước trên và phải cẩn thận: viết lại lịch sử để bỏ file. Sao lưu trước (git clone --mirror {repo} {repo}-backup.git), rồi trong một bản clone mới chạy git filter-repo --invert-paths --path {file}. Lệnh này viết lại mọi commit: muốn đẩy lên phải force push, mọi người phải clone lại, và các bản sao có từ trước vẫn giữ nguyên file."
author: the-last-devops
tests:
  - {"item": {"repo": "/h/Code/app", "repo_name": "app", "file": ".env", "kind": "env", "files": ".env", "count": 1, "others": 0}, "expect": true}
  - {"item": {"repo": "/h/Code/app", "repo_name": "app", "file": "", "kind": "env", "files": "", "count": 0, "others": 0}, "expect": false}
