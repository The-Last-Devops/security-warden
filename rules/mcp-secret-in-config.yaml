id: mcp-secret-in-config
severity: high
platforms: [macos, windows, linux]
source: ai_agents
match: "item.kind == \"mcp\" && item.has_secret"
title:
  en: "Token written into the {tool} MCP config ({server})"
  vi: "Token viết thẳng vào cấu hình MCP của {tool} ({server})"
explain:
  en: "The {server} MCP server in {file} has a literal secret ({secret_keys}). These files get copied, synced and read by other tools."
  vi: "MCP server {server} trong {file} chứa secret viết cứng ({secret_keys}). Các file này hay bị chép, đồng bộ và bị công cụ khác đọc."
fix:
  en: "Pass it from the environment (\"${env:NAME}\") or a password manager (op run), then rotate the token."
  vi: "Lấy nó từ biến môi trường (\"${env:NAME}\") hoặc trình quản lý mật khẩu (op run), rồi đổi token."
author: the-last-devops
tests:
  - {"item": {"kind": "mcp", "tool": "Claude Code", "file": "/h/.claude.json", "server": "github", "secret_keys": "GITHUB_TOKEN", "has_secret": true, "plain_http": false, "unpinned_npx": false, "world_readable": false}, "expect": true}
  - {"item": {"kind": "mcp", "tool": "Claude Code", "file": "/h/.claude.json", "server": "github", "secret_keys": "", "has_secret": false, "plain_http": false, "unpinned_npx": false, "world_readable": false}, "expect": false}
