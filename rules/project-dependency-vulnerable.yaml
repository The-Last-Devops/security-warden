id: project-dependency-vulnerable
severity: high
platforms: [macos, windows, linux]
source: project_deps
match: "item.severe && item.fixed != \"\""
title:
  en: "Library with a serious known vulnerability: {repo_name} · {package} {version} → {fixed}"
  vi: "Thư viện có lỗ hổng nghiêm trọng: {repo_name} · {package} {version} → {fixed}"
check:
  en: "No project dependency with a high or critical known vulnerability"
  vi: "Không thư viện nào trong dự án có lỗ hổng mức cao hay nghiêm trọng đã biết"
explain:
  en: "{lockfile} in {repo} pins {package} {version} ({ecosystem}), which has a published vulnerability rated high or critical: {ids}. Vulnerable packages in this repo: {packages}. Matched offline against the OSV database (osv.dev); nothing about your projects was sent."
  vi: "{lockfile} trong {repo} đang dùng {package} {version} ({ecosystem}), bản này có lỗ hổng mức cao hoặc nghiêm trọng đã công bố: {ids}. Số thư viện có lỗ hổng trong repo này: {packages}. Đối chiếu ngay trên máy với dữ liệu OSV (osv.dev); không gửi gì về dự án của bạn ra ngoài."
fix:
  en: "1. `cd {project} && {upgrade_cmd}` 2. If it stays below {fixed}, another package pulls it in. To see which: `cd {project} && {why}`, then upgrade that one. 3. Run the tests and commit the lock file. Looking up an id on osv.dev tells you whether your code is really exposed."
  vi: "1. `cd {project} && {upgrade_cmd}` 2. Nếu vẫn chưa lên {fixed} thì nó đi kèm một thư viện khác. Xem là thư viện nào: `cd {project} && {why}`, rồi nâng thư viện đó. 3. Chạy test và commit file lock. Tra mã lỗ hổng trên osv.dev để biết code của bạn có thật sự bị ảnh hưởng không."
author: the-last-devops
tests:
  - {"item": {"repo": "/h/Code/app", "repo_name": "app", "project": "/h/Code/app", "lockfile": "package-lock.json", "ecosystem": "npm", "package": "lodash", "version": "4.17.20", "fixed": "4.17.21", "ids": "CVE-2021-23337", "more_ids": 0, "severity": "high", "severe": true, "packages": 1, "others": 0, "upgrade_cmd": "npm install lodash@4.17.21", "why": "npm explain lodash"}, "expect": true}
  - {"item": {"repo": "/h/Code/app", "repo_name": "app", "project": "/h/Code/app", "lockfile": "package-lock.json", "ecosystem": "npm", "package": "lodash", "version": "4.17.20", "fixed": "4.17.21", "ids": "CVE-2020-28500", "more_ids": 0, "severity": "moderate", "severe": false, "packages": 1, "others": 0, "upgrade_cmd": "npm install lodash@4.17.21", "why": "npm explain lodash"}, "expect": false, "note": "project-dependency-vulnerable-moderate covers it"}
  - {"item": {"repo": "/h/Code/app", "repo_name": "app", "project": "/h/Code/app", "lockfile": "go.mod", "ecosystem": "Go", "package": "example.com/x", "version": "1.0.0", "fixed": "", "ids": "GO-2026-0001", "more_ids": 0, "severity": "high", "severe": true, "packages": 1, "others": 0, "upgrade_cmd": "go get example.com/x@v && go mod tidy", "why": "go mod why -m example.com/x"}, "expect": false, "note": "no fix yet: project-dependency-no-fix"}
