id: mcp-unpinned-package
severity: low
platforms: [macos, windows, linux]
source: ai_agents
match: "item.kind == \"mcp\" && item.unpinned_npx"
title:
  en: "MCP server {server} runs the latest npm package each time"
  vi: "MCP server {server} chạy gói npm mới nhất mỗi lần khởi động"
check:
  en: "MCP servers use pinned versions"
  vi: "MCP server dùng phiên bản cố định"
explain:
  en: "npx without a version downloads whatever was published last. A hijacked package runs on your machine the next time {tool} starts."
  vi: "npx không ghi phiên bản sẽ tải bản phát hành mới nhất. Gói bị chiếm sẽ chạy trên máy bạn ngay lần sau {tool} khởi động."
fix:
  en: "Pin a version in `{file}`, e.g. `\"package@1.2.3\"`."
  vi: "Ghim phiên bản trong `{file}`, ví dụ `\"package@1.2.3\"`."
author: the-last-devops
tests:
  - {"item": {"kind": "mcp", "tool": "Claude Code", "file": "/h/.claude.json", "server": "github", "secret_keys": "", "has_secret": false, "plain_http": false, "unpinned_npx": true, "world_readable": false}, "expect": true}
  - {"item": {"kind": "mcp", "tool": "Claude Code", "file": "/h/.claude.json", "server": "github", "secret_keys": "", "has_secret": false, "plain_http": false, "unpinned_npx": false, "world_readable": false}, "expect": false}
