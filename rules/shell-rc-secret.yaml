id: shell-rc-secret
severity: high
platforms: [macos, linux]
source: shell_rc
match: "item.kind == \"exported_secret\""
title:
  en: "Secret hard-coded in {file}: {var_name}"
  vi: "Secret viết cứng trong {file}: {var_name}"
check:
  en: "No secrets hard-coded in shell files"
  vi: "Không secret viết cứng trong file shell"
explain:
  en: "Line {line_no} exports {var_name} with a literal value. Every program you start can read it, and dotfiles get backed up and shared."
  vi: "Dòng {line_no} export {var_name} với giá trị viết cứng. Mọi chương trình bạn chạy đều đọc được, và file dotfile hay được sao lưu, chia sẻ."
fix:
  en: "Load it when needed instead: export {var_name}=$(security find-generic-password -s {var_name} -w), op read, or direnv per project. Rotate it if the file was ever shared."
  vi: "Lấy giá trị khi cần thay vì viết cứng: export {var_name}=$(security find-generic-password -s {var_name} -w), op read, hoặc direnv theo từng dự án. Đổi secret nếu file từng được chia sẻ."
author: the-last-devops
tests:
  - {"item": {"kind": "exported_secret", "file": "/h/.zshrc", "line_no": 12, "var_name": "OPENAI_API_KEY"}, "expect": true}
  - {"item": {"kind": "pipe_to_shell", "file": "/h/.zshrc", "line_no": 12, "var_name": ""}, "expect": false}
