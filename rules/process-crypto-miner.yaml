id: process-crypto-miner
severity: critical
platforms: [macos, linux]
source: processes
match: "item.miner"
title:
  en: "A crypto miner is running: {name}"
  vi: "Có chương trình đào tiền ảo đang chạy: {name}"
check:
  en: "No crypto miners are running"
  vi: "Không có chương trình đào tiền ảo nào đang chạy"
explain:
  en: "{path} (process {pid}) has the name of a well-known cryptocurrency miner. Unless you started it yourself, it usually means the machine was broken into: miners are what attackers install first, and they burn your CPU, battery and power bill."
  vi: "{path} (tiến trình {pid}) mang tên một chương trình đào tiền ảo phổ biến. Nếu không phải bạn tự chạy, thường là máy đã bị xâm nhập: đây là thứ kẻ tấn công cài đầu tiên, nó ngốn CPU, pin và tiền điện của bạn."
fix:
  en: "If you did not start it: stop it (kill {pid}), delete {path}, look for what restarts it (login items, cron, launchd), then change the passwords and keys used on this machine."
  vi: "Nếu không phải bạn chạy: dừng nó (kill {pid}), xoá {path}, tìm thứ khởi động lại nó (mục tự chạy, cron, launchd), rồi đổi mật khẩu và khoá đã dùng trên máy này."
author: the-last-devops
tests:
  - {"item": {"name": "xmrig", "path": "/tmp/.x/xmrig", "pid": 4242, "from_temp": true, "from_downloads": false, "miner": true}, "expect": true}
  - {"item": {"name": "helper", "path": "/tmp/helper", "pid": 4242, "from_temp": true, "from_downloads": false, "miner": false}, "expect": false}
