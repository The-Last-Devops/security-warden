id: sshd-password-auth
severity: medium
platforms: [linux]
source: posture
match: item.sshd_installed && item.sshd_password_auth
title:
  en: SSH accepts passwords
  vi: SSH chấp nhận đăng nhập bằng mật khẩu
check:
  en: "SSH server refuses passwords"
  vi: "SSH server không nhận mật khẩu"
explain:
  en: Password logins can be guessed by bots that scan every reachable SSH server. Keys cannot.
  vi: Đăng nhập bằng mật khẩu bị bot dò đoán, chúng quét mọi server SSH truy cập được. Dùng khoá thì không đoán được.
fix:
  en: "Keep your current session open the whole time. 1. In a new window, check you can log in with your SSH key. 2. `sudo sshd -T | grep -i passwordauthentication` shows the value in use; set `PasswordAuthentication no` in `/etc/ssh/sshd_config` and in any file in `/etc/ssh/sshd_config.d/` that says `yes` (`sudo nano <file>`; the first value found wins). 3. `sudo sshd -t` must print nothing. 4. `sudo systemctl reload ssh` (Fedora/RHEL: `sshd`), then test a new login."
  vi: "Giữ phiên đang mở suốt quá trình. 1. Mở cửa sổ mới, thử đăng nhập bằng khoá SSH. 2. `sudo sshd -T | grep -i passwordauthentication` cho biết giá trị đang dùng; đặt `PasswordAuthentication no` trong `/etc/ssh/sshd_config` và trong mọi tệp ở `/etc/ssh/sshd_config.d/` đang ghi `yes` (`sudo nano <tệp>`; giá trị gặp trước được dùng). 3. `sudo sshd -t` phải không in ra gì. 4. `sudo systemctl reload ssh` (Fedora/RHEL: `sshd`), rồi thử đăng nhập mới."
author: the-last-devops
tests:
  - {item: {sshd_installed: true, sshd_password_auth: true}, expect: true}
  - {item: {sshd_installed: true, sshd_password_auth: false}, expect: false}
  - {item: {sshd_installed: false, sshd_password_auth: false}, expect: false}
