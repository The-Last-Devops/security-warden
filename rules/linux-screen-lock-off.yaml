id: linux-screen-lock-off
severity: high
platforms: [linux]
source: posture
match: has(item.screen_lock) && !item.screen_lock
title:
  en: Screen lock is off
  vi: Khoá màn hình đang tắt
check:
  en: "Screen lock is on"
  vi: "Khoá màn hình đang bật"
explain:
  en: Anyone walking past an unattended machine can use it as you.
  vi: Ai đi ngang máy đang bỏ không cũng dùng được nó dưới danh nghĩa bạn.
fix:
  en: "Settings › Privacy & Security › Screen Lock (Privacy on older GNOME): turn on Automatic Screen Lock. Or run: gsettings set org.gnome.desktop.screensaver lock-enabled true"
  vi: "Cài đặt › Quyền riêng tư & Bảo mật › Khoá màn hình (bản GNOME cũ: Quyền riêng tư): bật tự khoá màn hình. Hoặc chạy: gsettings set org.gnome.desktop.screensaver lock-enabled true"
author: the-last-devops
tests:
  - {item: {screen_lock: false}, expect: true}
  - {item: {screen_lock: true}, expect: false}
  - {item: {}, expect: false}
