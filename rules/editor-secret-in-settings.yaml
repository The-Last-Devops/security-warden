id: editor-secret-in-settings
severity: high
platforms: [macos, windows, linux]
source: editor_settings
match: "item.has_secret"
title:
  en: "Secret written into {editor} settings"
  vi: "Secret viết thẳng vào cấu hình {editor}"
check:
  en: "No secrets written into VS Code and Cursor settings"
  vi: "Không secret nào viết thẳng vào cấu hình VS Code, Cursor"
explain:
  en: "{file} holds literal secrets in: {secret_settings}. Settings Sync uploads this file, and extensions can read it."
  vi: "{file} chứa secret viết cứng ở: {secret_settings}. Settings Sync tải file này lên mạng, và extension nào cũng đọc được."
fix:
  en: "Move them to environment variables (\"${env:NAME}\") or the extension's secret storage, then rotate them."
  vi: "Chuyển sang biến môi trường (\"${env:NAME}\") hoặc kho secret của extension, rồi đổi các secret đó."
author: the-last-devops
tests:
  - {"item": {"editor": "VS Code", "file": "/h/settings.json", "secret_settings": "", "workspace_trust_off": false, "untrusted_files_open": false, "auto_tasks_on": false, "proxy_strict_ssl_off": false, "extension_updates_off": false, "has_secret": true}, "expect": true}
  - {"item": {"editor": "VS Code", "file": "/h/settings.json", "secret_settings": "", "workspace_trust_off": false, "untrusted_files_open": false, "auto_tasks_on": false, "proxy_strict_ssl_off": false, "extension_updates_off": false, "has_secret": false}, "expect": false}
