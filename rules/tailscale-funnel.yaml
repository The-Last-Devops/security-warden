id: tailscale-funnel
severity: high
platforms: [macos, windows, linux]
source: tailscale
match: item.funnel
title:
  en: Tailscale Funnel publishes this machine to the internet
  vi: Tailscale Funnel đang đưa máy này ra internet
explain:
  en: Anyone on the internet can reach the service shared with Funnel, not only your tailnet.
  vi: Bất kỳ ai trên internet cũng vào được dịch vụ chia sẻ bằng Funnel, không chỉ người trong tailnet.
fix:
  en: "Run: tailscale funnel reset"
  vi: "Chạy: tailscale funnel reset"
author: the-last-devops
tests:
  - {item: {funnel: true}, expect: true}
  - {item: {funnel: false}, expect: false}
