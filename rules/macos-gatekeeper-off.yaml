id: macos-gatekeeper-off
severity: high
platforms: [macos]
source: posture
match: has(item.gatekeeper) && !item.gatekeeper
title:
  en: Gatekeeper is off
  vi: Gatekeeper đang tắt
check:
  en: "Gatekeeper is on"
  vi: "Gatekeeper đang bật"
explain:
  en: macOS no longer checks that downloaded apps are signed and notarized.
  vi: macOS thôi kiểm tra app tải về có được ký và notarize hay không.
fix:
  en: "Press Fix to do it automatically, or run: sudo spctl --global-enable (asks for your password)."
  vi: "Bấm Sửa để tự sửa, hoặc chạy: sudo spctl --global-enable (sẽ hỏi mật khẩu máy)."
author: the-last-devops
tests:
  - {item: {gatekeeper: false}, expect: true}
  - {item: {gatekeeper: true}, expect: false}
remedy: {action: macos_gatekeeper_on}
