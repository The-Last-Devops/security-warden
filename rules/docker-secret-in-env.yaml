id: docker-secret-in-env
severity: medium
platforms: [macos, windows, linux]
source: docker_containers
match: "item.secret_env != \"\""
title:
  en: "Container {container} gets secrets as plain environment variables"
  vi: "Container {container} nhận mật khẩu/token qua biến môi trường"
check:
  en: "No secrets in container environment variables"
  vi: "Không có secret trong biến môi trường container"
explain:
  en: "{secret_env} are visible to anyone who can run docker inspect, and often end up in logs and crash reports."
  vi: "{secret_env} hiện ra cho bất kỳ ai chạy được docker inspect, và hay lọt vào log hoặc báo cáo lỗi."
fix:
  en: "Move {secret_env} into a file: in compose, add secrets: {db_pass: {file: ./db_pass.txt}} at the top level and secrets: [db_pass] under the service, then set the matching *_FILE variable (POSTGRES_PASSWORD_FILE=/run/secrets/db_pass) if the image supports it (the official postgres and mysql images do). Apply with docker compose up -d, then change the password, since docker inspect showed it."
  vi: "Chuyển {secret_env} sang tệp: trong compose, thêm secrets: {db_pass: {file: ./db_pass.txt}} ở cấp ngoài cùng và secrets: [db_pass] trong service, rồi đặt biến *_FILE tương ứng (POSTGRES_PASSWORD_FILE=/run/secrets/db_pass) nếu image hỗ trợ (image chính thức của postgres và mysql có hỗ trợ). Áp dụng bằng docker compose up -d, rồi đổi mật khẩu vì docker inspect đã để lộ nó."
author: the-last-devops
tests:
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": false, "host_pid": false, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "POSTGRES_PASSWORD", "user": "app", "runs_as_root": false}, "expect": true}
  - {"item": {"container": "app", "image": "acme/app:1.2", "privileged": false, "host_network": false, "host_pid": false, "host_ipc": false, "mounts_docker_sock": false, "risky_mount": "", "dangerous_caps": "", "seccomp_unconfined": false, "apparmor_unconfined": false, "devices": 0, "secret_env": "", "user": "app", "runs_as_root": false}, "expect": false}
