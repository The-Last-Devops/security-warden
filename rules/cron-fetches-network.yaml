id: cron-fetches-network
severity: medium
platforms: [macos, linux]
source: persistence
match: "item.kind == \"cron\" && item.fetches_network && !item.pipes_to_shell"
title:
  en: "A cron job reaches out to {url_host}"
  vi: "Một cron job gọi ra {url_host}"
check:
  en: "No cron jobs calling the network"
  vi: "Không cron job nào gọi ra mạng"
explain:
  en: "Line {line_no} of your crontab runs {command} against {url_host}. Cron jobs are easy to forget and a common foothold for miners and malware."
  vi: "Dòng {line_no} trong crontab chạy {command} ra mạng ({url_host}). Cron job rất dễ bị quên, và hay bị mã độc, máy đào coin dùng để bám trụ."
fix:
  en: "Run `crontab -l` and find line {line_no} (it contacts {url_host}). If it is yours (a keep-alive ping, a backup), keep it. Otherwise: 1. Save a copy: `crontab -l > ~/crontab-backup.txt` 2. Run `crontab -e`, delete that line, save and quit. To undo: `crontab ~/crontab-backup.txt`"
  vi: "Chạy `crontab -l` và tìm dòng {line_no} (nó gọi tới {url_host}). Nếu là của bạn (ping giữ kết nối, sao lưu) thì cứ giữ. Nếu không: 1. Lưu bản sao: `crontab -l > ~/crontab-backup.txt` 2. Chạy `crontab -e`, xoá dòng đó, lưu và thoát. Muốn hoàn tác: `crontab ~/crontab-backup.txt`"
author: the-last-devops
tests:
  - {"item": {"kind": "cron", "line_no": 3, "command": "curl", "url_host": "x.example", "fetches_network": true, "pipes_to_shell": false, "runs_every_minute": false}, "expect": true}
  - {"item": {"kind": "cron", "line_no": 3, "command": "curl", "url_host": "x.example", "fetches_network": true, "pipes_to_shell": true, "runs_every_minute": false}, "expect": false}
  - {"item": {"kind": "cron", "line_no": 3, "command": "curl", "url_host": "x.example", "fetches_network": false, "pipes_to_shell": false, "runs_every_minute": false}, "expect": false}
