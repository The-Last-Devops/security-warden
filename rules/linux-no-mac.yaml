id: linux-no-mac
severity: low
platforms: [linux]
source: posture
match: item.lsm in ["none", "selinux-permissive"] && !item.container
title:
  en: "No mandatory access control is enforced ({lsm})"
  vi: "Không có kiểm soát truy cập bắt buộc ({lsm})"
check:
  en: "AppArmor or SELinux is enforced"
  vi: "AppArmor hoặc SELinux đang bật"
explain:
  en: AppArmor or SELinux limit what a compromised service can touch. Without them a bug in one program reaches all your files.
  vi: AppArmor hoặc SELinux giới hạn những gì một dịch vụ bị chiếm có thể đụng tới. Không có chúng thì lỗi ở một chương trình là lan tới mọi file của bạn.
fix:
  en: "Ubuntu/Debian: `sudo systemctl enable --now apparmor`. Fedora/RHEL, step by step (going straight to enforcing can stop the machine from booting): 1. `sudo nano /etc/selinux/config`, set `SELINUX=permissive`, reboot. 2. `sudo fixfiles -F onboot`, reboot (slow: it relabels every file). 3. If `sudo ausearch -m AVC -ts today` shows no denials, set `SELINUX=enforcing` and reboot."
  vi: "Ubuntu/Debian: `sudo systemctl enable --now apparmor`. Fedora/RHEL, làm từng bước (bật thẳng enforcing có thể khiến máy không khởi động được): 1. `sudo nano /etc/selinux/config`, đặt `SELINUX=permissive`, khởi động lại. 2. `sudo fixfiles -F onboot`, khởi động lại (lâu vì gắn nhãn lại mọi tệp). 3. Nếu `sudo ausearch -m AVC -ts today` không báo bị chặn gì, đặt `SELINUX=enforcing` và khởi động lại."
author: the-last-devops
tests:
  - {item: {lsm: none, container: false}, expect: true}
  - {item: {lsm: selinux-permissive, container: false}, expect: true}
  - {item: {lsm: apparmor, container: false}, expect: false}
