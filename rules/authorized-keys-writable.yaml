id: authorized-keys-writable
severity: high
platforms: [macos, linux]
source: authorized_keys
match: "item.group_readable || item.world_readable"
title:
  en: "authorized_keys can be read by other users"
  vi: "Người dùng khác đọc được authorized_keys"
explain:
  en: "{path} has mode {mode}. sshd may refuse it, and others learn who can log in."
  vi: "{path} đang có quyền {mode}. sshd có thể từ chối file, và người khác biết được ai đăng nhập được."
fix:
  en: "Run: chmod 600 {path}"
  vi: "Chạy: chmod 600 {path}"
author: the-last-devops
tests:
  - {"item": {"path": "/h/.ssh/authorized_keys", "count": 2, "weak": 0, "restricted": 0, "ssh_on": true, "mode": "0644", "group_readable": true, "world_readable": true}, "expect": true}
  - {"item": {"path": "/h/.ssh/authorized_keys", "count": 2, "weak": 0, "restricted": 0, "ssh_on": true, "mode": "0600", "group_readable": false, "world_readable": false}, "expect": false}
remedy: {"action": "chmod_private", "params": {"path": "{path}"}}
