id: docker-insecure-registries
severity: medium
platforms: [macos, windows, linux]
source: docker_config
match: "item.insecure_registries > 0"
title:
  en: "Docker pulls images from {insecure_registries} insecure registries"
  vi: "Docker kéo image từ {insecure_registries} registry không an toàn"
check:
  en: "Docker pulls only over TLS"
  vi: "Docker chỉ kéo image qua TLS"
explain:
  en: "Images from insecure-registries travel without TLS and can be replaced."
  vi: "Image từ insecure-registries đi không qua TLS và có thể bị thay."
fix:
  en: "Docker Desktop › Settings › Docker Engine (Linux: back it up with `sudo cp /etc/docker/daemon.json /etc/docker/daemon.json.bak`, then `sudo nano /etc/docker/daemon.json`): remove the entries under `\"insecure-registries\"`, then Apply & restart (Linux: `sudo systemctl restart docker`, which restarts running containers). Give the registry a TLS certificate instead. These commands need admin rights: sudo asks for your password."
  vi: "Docker Desktop › Settings › Docker Engine (Linux: sao lưu bằng `sudo cp /etc/docker/daemon.json /etc/docker/daemon.json.bak`, rồi `sudo nano /etc/docker/daemon.json`): xoá các mục trong `\"insecure-registries\"`, rồi Apply & restart (Linux: `sudo systemctl restart docker`, lệnh này khởi động lại các container đang chạy). Thay vào đó, cấp chứng chỉ TLS cho registry. Các lệnh này cần quyền quản trị: sudo sẽ hỏi mật khẩu của bạn."
author: the-last-devops
tests:
  - {"item": {"expose_tcp_no_tls": false, "insecure_registries": 2, "found": true}, "expect": true}
  - {"item": {"expose_tcp_no_tls": false, "insecure_registries": 0, "found": true}, "expect": false}
