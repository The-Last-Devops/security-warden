id: internet-sharing-on
severity: medium
platforms: [macos]
source: sharing
match: "item.kind == \"internet_sharing\" && item.service_on"
title:
  en: "Internet Sharing is on"
  vi: "Đang bật Chia sẻ Internet"
explain:
  en: "This Mac acts as a router for other devices, often over an open or weakly protected Wi-Fi network."
  vi: "Máy đang làm router cho thiết bị khác, thường qua mạng Wi-Fi mở hoặc mật khẩu yếu."
fix:
  en: "System Settings > General > Sharing > Internet Sharing: off."
  vi: "Cài đặt hệ thống > Cài đặt chung > Chia sẻ > Chia sẻ Internet: tắt."
author: the-last-devops
tests:
  - {"item": {"kind": "internet_sharing", "service_on": true}, "expect": true}
  - {"item": {"kind": "internet_sharing", "service_on": false}, "expect": false}
