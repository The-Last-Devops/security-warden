id: software-outdated-many
severity: low
platforms: [macos, linux]
source: outdated_software
match: item.kind == "summary" && item.total >= 10
title:
  en: "{total} Homebrew packages are out of date"
  vi: "{total} gói Homebrew đã cũ"
check:
  en: "Homebrew packages are up to date"
  vi: "Các gói Homebrew đã cập nhật"
explain:
  en: "{formulae} formulae and {casks} apps have newer versions. Old libraries such as OpenSSL or curl carry known security bugs."
  vi: "{formulae} gói và {casks} app đã có bản mới. Thư viện cũ như OpenSSL hay curl mang theo lỗi bảo mật đã biết."
fix:
  en: "Run: brew upgrade"
  vi: "Chạy: brew upgrade"
author: the-last-devops
tests:
  - {item: {kind: summary, total: 42, formulae: 40, casks: 2}, expect: true}
  - {item: {kind: summary, total: 3, formulae: 3, casks: 0}, expect: false}
remedy: {action: brew_upgrade_all}
