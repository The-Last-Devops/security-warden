name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Same Dockerfile as on a laptop: vet, tests (every rule's samples), and
  # cross-compiled binaries.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test and build
        run: |
          docker buildx build --target export --output dist \
            --build-arg VERSION=ci-${GITHUB_SHA::7} \
            --cache-from type=gha --cache-to type=gha,mode=max .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Run the real scan on a real Mac. It must finish and print valid JSON;
  # findings on the runner are expected and do not fail the job.
  smoke-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Scan
        run: |
          chmod +x security-warden-darwin-arm64
          ./security-warden-darwin-arm64 version
          ./security-warden-darwin-arm64 rules
          # Exit 1 means "found something high", which is fine on a runner.
          ./security-warden-darwin-arm64 --lang vi || [ $? -eq 1 ]
          ./security-warden-darwin-arm64 --json > report.json || [ $? -eq 1 ]
          python3 -c "import json; r=json.load(open('report.json')); print(r['score'], len(r['findings']))"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-report-macos
          path: report.json

  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Scan
        run: |
          chmod +x security-warden-linux-amd64
          ./security-warden-linux-amd64 --lang vi || [ $? -eq 1 ]
          ./security-warden-linux-amd64 --json > report.json || [ $? -eq 1 ]
          python3 -c "import json; r=json.load(open('report.json')); print(r['score'], len(r['findings']))"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-report-linux
          path: report.json

  # Windows: the checks run PowerShell and netstat as the runner's user. The
  # Windows sources must run without error (a skip is fine).
  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Scan
        shell: bash
        run: |
          ./security-warden-windows-amd64.exe version
          ./security-warden-windows-amd64.exe --lang vi || [ $? -eq 1 ]
          ./security-warden-windows-amd64.exe --json > report.json || [ $? -eq 1 ]
          python -c "
          import json, sys
          r = json.load(open('report.json', encoding='utf-8'))
          print(r['platform'], r['score'], len(r['findings']))
          for s in r['sources']:
              print(' ', s['name'], s.get('items'), s.get('skipped', ''), s.get('error', ''))
          bad = [s['name'] for s in r['sources'] if s['name'] in ('posture', 'defender', 'persistence', 'listening_ports', 'processes') and s.get('error')]
          sys.exit('failed on Windows: ' + ', '.join(bad) if bad else 0)
          "
      # The Quick start line ends with "start": check the background service
      # really runs and answers on Windows, then stop it.
      - name: Background service
        shell: pwsh
        run: |
          .\security-warden-windows-amd64.exe start
          Start-Sleep -Seconds 5
          .\security-warden-windows-amd64.exe status
          $r = Invoke-WebRequest -UseBasicParsing -Headers @{ Host = "localhost:7348" } http://127.0.0.1:7348/api/passkey
          if ($r.StatusCode -ne 200) { throw "service did not answer" }
          .\security-warden-windows-amd64.exe stop
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-report-windows
          path: report.json
