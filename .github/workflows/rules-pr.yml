name: rules-pr

# Checks the rule files a pull request adds or changes with
# `security-warden rules check --strict` and saves the results as an
# artifact. This job only reads: it runs the PR's code with a read-only
# token and no secrets. Commenting and labelling happen in
# rules-pr-comment.yml (workflow_run), which never runs PR code.
# Nothing here approves or merges: merging stays manual.
on:
  pull_request:
    paths:
      - "rules/**"

permissions:
  contents: read

jobs:
  rules-check:
    runs-on: ubuntu-latest
    container: golang:1.27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The web UI is not needed to check rules: an empty web/dist lets the
      # binary build without Node.
      - name: Build the CLI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p web/dist && touch web/dist/.keep
          CGO_ENABLED=0 go build -o /tmp/security-warden ./cmd/security-warden

      - name: Check changed rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          mkdir -p out
          git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" -- 'rules/*.yaml' > out/added.txt
          git diff --name-only --diff-filter=MR "$BASE_SHA" "$HEAD_SHA" -- 'rules/*.yaml' > out/modified.txt
          status=0
          if [ -s out/added.txt ]; then
            xargs -d '\n' /tmp/security-warden rules check --strict --new --json --lang en < out/added.txt > out/added.json || status=1
          fi
          if [ -s out/modified.txt ]; then
            xargs -d '\n' /tmp/security-warden rules check --strict --json --lang en < out/modified.txt > out/modified.json || status=1
          fi
          # Did any changed rule touch its fix text? (reviewers read those twice)
          git diff "$BASE_SHA" "$HEAD_SHA" -- 'rules/*.yaml' | grep -qE '^[+-][[:space:]]*fix:|^[+-][[:space:]]+(en|vi):' && echo true > out/fix_changed.txt || echo false > out/fix_changed.txt
          echo "$status" > out/status.txt
          exit "$status"

      # PR text is untrusted: it reaches the script only through env and is
      # used as data (searched for words), never run.
      - name: Record PR metadata
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p out
          words='ai-generated|ai generated|generated by|claude|copilot|chatgpt|codex|cursor|llm|gpt'
          ai=false
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qiE "$words"; then ai=true; fi
          if git log --format=%B "$BASE_SHA..$HEAD_SHA" 2>/dev/null | grep -qiE "$words"; then ai=true; fi
          case "$PR_AUTHOR_TYPE" in Bot) ai=true ;; esac
          case "$PR_AUTHOR" in *'[bot]') ai=true ;; esac
          printf '{"number":%s,"head_sha":"%s","author":"%s","author_type":"%s","ai":%s}\n' \
            "$PR_NUMBER" "$HEAD_SHA" "$(printf '%s' "$PR_AUTHOR" | tr -cd 'A-Za-z0-9[]_-')" \
            "$(printf '%s' "$PR_AUTHOR_TYPE" | tr -cd 'A-Za-z')" "$ai" > out/meta.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rules-check
          path: out/
          retention-days: 7
