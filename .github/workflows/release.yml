name: release

# Push a tag like v0.1.0 to publish binaries, a macOS .dmg, SHA256SUMS and
# the Homebrew formula.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Two builds side by side: the macOS binaries first, so the .dmg can start
  # while Linux and Windows still compile. CI already tested this commit.
  build-mac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build darwin/arm64 darwin/amd64
        run: |
          docker buildx build --target export --output dist \
            --build-arg VERSION=${GITHUB_REF_NAME} \
            --build-arg BUILD_BASE=src \
            --build-arg "TARGETS=darwin/arm64 darwin/amd64" \
            --cache-from type=gha --cache-from type=gha,scope=release-mac \
            --cache-to type=gha,scope=release-mac,mode=max .
          rm dist/SHA256SUMS
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: dist/

  build-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64 linux/arm64 windows/amd64
        run: |
          docker buildx build --target export --output dist \
            --build-arg VERSION=${GITHUB_REF_NAME} \
            --build-arg BUILD_BASE=src \
            --build-arg "TARGETS=linux/amd64 linux/arm64 windows/amd64" \
            --cache-from type=gha --cache-from type=gha,scope=release-rest \
            --cache-to type=gha,scope=release-rest,mode=max .
          rm dist/SHA256SUMS
      - name: Linux packages (.deb, .rpm)
        run: |
          scripts/make-packages.sh "$GITHUB_REF_NAME"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-rest
          path: dist/

  # hdiutil and lipo only exist on macOS.
  dmg:
    needs: build-mac
    runs-on: macos-latest
    outputs:
      notarized: ${{ steps.dmg.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-mac
          path: dist
      - name: Build .dmg (with Security Warden.app)
        id: dmg
        env:
          # Developer ID Application certificate (.p12, base64) and its
          # password; App Store Connect API key (.p8, base64) for notarization.
          # Without them the .dmg is unsigned and Gatekeeper blocks it.
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/make-dmg.sh "$GITHUB_REF_NAME" dist
      # The darwin binaries and archives come from here, signed with the
      # .dmg (make-dmg.sh), not from build-mac.
      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: |
            dist/*.dmg
            dist/security-warden-darwin-*

  publish:
    needs: [build-mac, build-rest, dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-rest
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dmg
          path: dist
      - name: Checksums
        run: cd dist && sha256sum security-warden* > SHA256SUMS && cat SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
      - name: Homebrew formula
        run: scripts/brew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > security-warden.rb
      # The app cask only for a notarized .dmg: Gatekeeper would block an
      # unsigned app, so the tap keeps the previous good one instead.
      - name: Homebrew cask (macOS app)
        if: needs.dmg.outputs.notarized == 'true'
        run: scripts/brew-cask.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > security-warden-app.rb

      # This repository is its own Homebrew tap: the formula lives in
      # Formula/ on main, so GITHUB_TOKEN can update it.
      - name: Update Homebrew formula on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p Formula
          cp security-warden.rb Formula/security-warden.rb
          git add Formula/security-warden.rb
          if [ -f security-warden-app.rb ]; then
            mkdir -p Casks
            cp security-warden-app.rb Casks/security-warden-app.rb
            git add Casks/security-warden-app.rb
          fi
          git commit -m "Homebrew formula and cask for ${GITHUB_REF_NAME}" || exit 0
          git push origin main

  # Install the release the way users do and make sure it really is the new
  # version: catches a formula that points at the wrong files or version.
  verify-brew:
    needs: publish
    runs-on: macos-latest
    steps:
      - name: Install from the tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap the-last-devops/security-warden https://github.com/${{ github.repository }}
          brew trust the-last-devops/security-warden 2>/dev/null || true
          brew install security-warden
      - name: App from the cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # Only when this release published a cask (a notarized .dmg).
          if ! brew info --cask the-last-devops/security-warden/security-warden-app 2>/dev/null | grep -q "${GITHUB_REF_NAME#v}"; then
            echo "no cask for ${GITHUB_REF_NAME}: skipped"; exit 0
          fi
          brew install --cask the-last-devops/security-warden/security-warden-app
          test -x "/Applications/Security Warden.app/Contents/MacOS/Security Warden"
          codesign --verify --deep --strict "/Applications/Security Warden.app"
          spctl -a -vv "/Applications/Security Warden.app"
          # The formula's binary is signed by the same team as the app.
          codesign --verify --strict "$(brew --prefix)/opt/security-warden/bin/security-warden"
          app_team=$(codesign -dv "/Applications/Security Warden.app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          cli_team=$(codesign -dv "$(brew --prefix)/opt/security-warden/bin/security-warden" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          echo "app $app_team, cli $cli_team"
          [ -n "$app_team" ] && [ "$app_team" = "$cli_team" ]
      - name: Version matches the tag
        run: |
          got=$(security-warden version)
          echo "installed $got, tag $GITHUB_REF_NAME"
          [ "$got" = "$GITHUB_REF_NAME" ]
      - name: Scan runs
        run: |
          security-warden --json > report.json || [ $? -eq 1 ]
          python3 -c "import json; r=json.load(open('report.json')); print(r['score'], r['checked'], len(r['findings']))"

  # Install the Linux packages the way users do, on the distributions they use.
  verify-linux:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # The exact one-line commands from docs/install.md, as users run them.
      - name: One-line install on Ubuntu and Debian
        run: |
          for img in ubuntu:24.04 debian:12; do
            docker run --rm "$img" sh -c '
              apt-get update -qq >/dev/null && apt-get install -y -qq wget ca-certificates >/dev/null
              wget -qO /tmp/security-warden.deb https://github.com/The-Last-Devops/security-warden/releases/latest/download/security-warden_$(dpkg --print-architecture).deb && apt-get install -y -qq /tmp/security-warden.deb >/dev/null
              security-warden version' | tee v.txt
            [ "$(cat v.txt)" = "$GITHUB_REF_NAME" ]
          done
      - name: One-line install on Fedora
        run: |
          docker run --rm fedora:41 sh -c '
            dnf install -y -q https://github.com/The-Last-Devops/security-warden/releases/latest/download/security-warden-$(uname -m).rpm >/dev/null
            security-warden version' | tee v.txt
          [ "$(cat v.txt)" = "$GITHUB_REF_NAME" ]
