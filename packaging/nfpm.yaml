# Linux packages (.deb, .rpm). Built by scripts/make-packages.sh with nfpm;
# ${VERSION} and ${ARCH} come from the environment.
name: security-warden
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: The Last Devops <noreply@github.com>
description: |
  Lightweight security checkup for work machines: open doors, leaked
  secrets, risky settings, Docker, AI agents and developer tools.
vendor: The Last Devops
homepage: https://github.com/The-Last-Devops/security-warden
license: Apache-2.0
contents:
  - src: dist/security-warden-linux-${ARCH}
    dst: /usr/bin/security-warden
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/security-warden/LICENSE
  - src: NOTICE
    dst: /usr/share/doc/security-warden/NOTICE
